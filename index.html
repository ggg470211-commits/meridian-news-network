<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable && (!desc.writable || !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>Meridian News Network | Global 24/7 Broadcast Journalism & Breaking Wire</title>
    <meta name="description" content="Global 24/7 broadcast journalism, breaking news dispatches, live stream coverage, investigative reporting, and financial markets." />
    <meta property="og:title" content="Meridian News Network | Global 24/7 Broadcast Journalism" />
    <meta property="og:description" content="Global 24/7 broadcast journalism, breaking news dispatches, live stream coverage, investigative reporting, and financial markets." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>

  </body>
</html>
